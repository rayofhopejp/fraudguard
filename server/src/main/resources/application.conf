ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    # モジュール読み込みはApplication.ktのembeddedServer(module = Application::module)で明示的に行うため、
    # ここでの ktor.application.modules 指定はしない
    # (指定すると、testApplication がconfig経由でも二重にmodule()を呼び出しDuplicatePluginExceptionになる)。
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/fraudguard"
    jdbcUrl = ${?DATABASE_URL}
    user = "fraudguard"
    user = ${?DATABASE_USER}
    password = "fraudguard"
    password = ${?DATABASE_PASSWORD}
}

auth {
    # Cognito User Pool JWT issuer, e.g. https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_xxxxxxx
    cognitoIssuer = ""
    cognitoIssuer = ${?COGNITO_ISSUER}
    cognitoAudience = ""
    cognitoAudience = ${?COGNITO_AUDIENCE}
}

fcm {
    # Firebase service-account credentials path, mounted at deploy time (never committed).
    # requirements.md 8章: 現状は遠隔コマンド(通話切断)配信専用の想定として温存(未実装)。
    serviceAccountPath = "/etc/fraudguard/fcm-service-account.json"
    serviceAccountPath = ${?FCM_SERVICE_ACCOUNT_PATH}
}

slack {
    # requirements.md 2.2章: 家族への一次通知はSlack Incoming Webhook経由。未設定ならNoopFamilyNotifierとなり、
    # 通知は送信されない(サーバー自体は正常に起動・動作する)。
    webhookUrl = ""
    webhookUrl = ${?SLACK_WEBHOOK_URL}
}

commandSigning {
    # Ed25519 keypair used to sign remote commands (requirements.md 8.1). Never committed.
    privateKeyPath = "/etc/fraudguard/command-signing-private.pem"
    privateKeyPath = ${?COMMAND_SIGNING_PRIVATE_KEY_PATH}
}
